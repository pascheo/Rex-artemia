version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: artemia
      POSTGRES_USER: artemia
      POSTGRES_PASSWORD: artemia
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artemia -d artemia"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://artemia:artemia@postgres:5432/artemia
      PORT: 3001
      # Remplacer la valeur ci-dessous par un token sécurisé avant déploiement
      ADMIN_TOKEN: changeme
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # En production, remplacer par l'adresse IP/nom du serveur
        VITE_API_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
